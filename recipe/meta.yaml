{% set name = "pysmspp" %}
{% set version = "0.0.9" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9438545323dbd4b8ce76d6a1b62a39e783a20f37c3348c9c84147b59dd10a6e5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - pandas >=0.24
    - pathlib
    - netcdf4
    - psutil
    - matplotlib >=3.0

test:
  imports:
    - pysmspp
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check
    - python -c "import pysmspp; model = pysmspp.SMSNetwork()"

about:
  home: https://github.com/SPSUnipi/pySMSpp
  summary: 'Python interface for SMS++'
  description: |
    This package aims at providing a python interface to create SMS++ models using a simple python interface.
    The package aims to support:
    - Read/write operations of SMS++ models from/to netCDF4 files
    - Add/remove/edit operations model components
    - Execution of SMS++ models
    - Reading SMS++ results as netCDF4 files
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  doc_url: https://pysmspp.readthedocs.io/
  dev_url: https://github.com/SPSUnipi/pySMSpp

extra:
  recipe-maintainers:
    - davide-f
